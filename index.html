<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Abdullah Online Zone · Typing Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=Noto+Serif+Bengali:wght@400;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#241c38; --paper:#f4f1ea; --paper-2:#eae4d4; --rule:#cabfe3;
    --violet:#5b2f8c; --violet-soft:#7a4bb0; --navy:#16224f; --gold:#b8860b;
    --bg:#120d22; --bg-2:#1c1436; --danger:#8c2f3f; --good:#2f6b46;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: radial-gradient(1100px 620px at 50% -8%, var(--bg-2), var(--bg) 70%);
    color: var(--ink); font-family:'Source Serif 4', serif; min-height:100vh;
  }
  [data-lang="bn"] .serif{ font-family:'Noto Serif Bengali', serif; }
  button{ font-family: inherit; cursor:pointer; }
  input{ font-family: inherit; }
  .page{ max-width: 1080px; margin:0 auto; padding: 22px 16px 50px; }

  header{ display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap; margin-bottom:20px; }
  .brand{ display:flex; align-items:center; gap:14px; color: var(--paper); }
  .brand img{ width:50px; height:50px; border-radius:50%; box-shadow:0 0 0 2px var(--gold); }
  .brand .title{ font-size: clamp(18px,3vw,24px); font-weight:700; margin:0; }
  .brand .sub{ margin:2px 0 0; font-size:12px; color:#c9bfe0; }
  .who{ display:flex; align-items:center; gap:10px; color:#dcd3f0; font-size:13px; }
  .who button{ background: var(--bg-2); border:1px solid #4a3a6b; color:#c9bfe0; padding:7px 14px; border-radius:6px; font-size:13px; }

  .card{ background: var(--paper); border-radius:10px; box-shadow:0 30px 60px -25px rgba(0,0,0,.6), 0 0 0 1px var(--rule); padding: clamp(18px,3.4vw,30px); }

  /* Auth screen */
  .auth-card{ max-width: 420px; margin: 40px auto; }
  .auth-card h2{ margin-top:0; font-size:20px; }
  .role-toggle{ display:flex; gap:8px; margin-bottom:16px; }
  .role-toggle button{ flex:1; padding:10px; border-radius:6px; border:1px solid var(--rule); background:#fff; color:#6b6180; font-size:14px; }
  .role-toggle button.active{ background: var(--violet); border-color: var(--violet); color:#fff; font-weight:600; }
  .field{ margin-bottom:12px; }
  .field label{ display:block; font-size:13px; color:#6b6180; margin-bottom:4px; }
  .field input{ width:100%; padding:10px 12px; border:1px solid var(--rule); border-radius:6px; font-size:15px; background:#fbf9f2; }
  .authBtn{ width:100%; background: var(--violet); color:#fff; border:none; padding:12px; border-radius:6px; font-size:15px; font-weight:600; margin-top:6px; }
  .authBtn:hover{ background: var(--violet-soft); }
  .switchMode{ text-align:center; margin-top:14px; font-size:13px; color:#6b6180; }
  .switchMode a{ color: var(--violet); cursor:pointer; text-decoration:underline; }
  .authMsg{ font-size:13px; padding:10px; border-radius:6px; margin-bottom:12px; display:none; }
  .authMsg.show{ display:block; }
  .authMsg.error{ background:#f7e3e3; color: var(--danger); }
  .authMsg.ok{ background:#e6f0e9; color: var(--good); }

  /* Tabs */
  .tabs{ display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap; }
  .tabs button{ background: var(--bg-2); border:1px solid #4a3a6b; color:#c9bfe0; padding:9px 16px; border-radius:6px; font-size:13px; }
  .tabs button.active{ background: var(--gold); color: var(--ink); font-weight:700; border-color: var(--gold); }

  .keys{ display:grid; grid-template-columns: repeat(2,1fr); gap:10px; margin-bottom:16px; }
  @media (min-width:640px){ .keys{ grid-template-columns: repeat(4,1fr); } }
  .key{ background: linear-gradient(180deg,#fff,var(--paper-2)); border-radius:8px; padding:14px 12px; box-shadow:0 3px 0 var(--rule), 0 10px 18px -10px rgba(0,0,0,.5); text-align:center; }
  .key .num{ font-family:'JetBrains Mono', monospace; font-size: clamp(20px,4vw,26px); font-weight:700; color: var(--violet); line-height:1; }
  .key .lbl{ font-size:11px; color:#6b6180; margin-top:5px; }

  .passage-wrap{ border-top:1px solid var(--rule); border-bottom:1px solid var(--rule); padding:20px 0; margin-bottom:16px; }
  #passage{ font-size: clamp(17px,2.2vw,21px); line-height:1.9; max-width:68ch; }
  .char-correct{ color: var(--navy); } .char-wrong{ color:#fff; background: var(--danger); border-radius:2px; }
  .char-pending{ color:#8d84a1; } .char-current{ border-bottom:2px solid var(--gold); }
  textarea#input{ width:100%; min-height:84px; resize:none; border:1px solid var(--rule); background:#fbf9f2; border-radius:6px; padding:12px 14px; font-size:16px; color:var(--ink); }
  .controls{ display:flex; align-items:center; justify-content:flex-end; margin-top:16px; gap:10px; }
  #restart{ background: var(--violet); color:#fff; border:none; padding:11px 24px; border-radius:6px; font-weight:600; }
  .result-banner{ display:none; margin-top:16px; padding:13px 15px; border:1px solid var(--navy); border-radius:6px; background:#e9edf5; font-size:14px; }
  .result-banner.show{ display:block; }

  /* Leaderboard */
  table{ width:100%; border-collapse: collapse; font-size:14px; }
  th, td{ text-align:left; padding:10px 8px; border-bottom:1px solid var(--rule); }
  th{ color:#6b6180; font-size:12px; text-transform:none; }
  tr.me{ background:#efe8fb; }

  .hidden{ display:none !important; }
  footer{ text-align:center; color:#8a7fae; font-size:12px; margin-top:20px; }
</style>
</head>

  <!-- AUTH SCREEN -->
  <div class="card auth-card" id="authScreen">
    <div class="role-toggle" id="roleToggle">
      <button data-role="student" class="active">শিক্ষার্থী</button>
      <button data-role="teacher">প্রশিক্ষক</button>
    </div>
    <div class="authMsg" id="authMsg"></div>
    <h2 id="authTitle">লগইন করুন</h2>
    <div class="field" id="nameField">
      <label>নাম</label>
      <input type="text" id="nameInput" placeholder="আপনার নাম">
    </div>
    <div class="field">
      <label>ইমেইল</label>
      <input type="email" id="emailInput" placeholder="you@example.com">
    </div>
    <div class="field">
      <label>পাসওয়ার্ড</label>
      <input type="password" id="passInput" placeholder="কমপক্ষে ৬ ডিজিট">
    </div>
    <button class="authBtn" id="authSubmit">লগইন করুন</button>
    <div class="switchMode">
      নতুন এখানে? <a id="toggleMode">অ্যাকাউন্ট তৈরি করুন</a>
    </div>
  </div>

  <!-- APP SCREEN -->
  <div id="appScreen" class="hidden">
    <div class="tabs">
      <button data-tab="typing" class="active">টাইপিং টেস্ট</button>
      <button data-tab="leaderboard">লিডারবোর্ড</button>
    </div>

    <div id="typingTab">
      <div class="keys">
        <div class="key"><div class="num" id="statWpm">0</div><div class="lbl">WPM</div></div>
        <div class="key"><div class="num" id="statAcc">100%</div><div class="lbl">নির্ভুলতা</div></div>
        <div class="key"><div class="num" id="statTime">30</div><div class="lbl">বাকি সেকেন্ড</div></div>
        <div class="key"><div class="num" id="statErr">0</div><div class="lbl">ভুল</div></div>
      </div>
      <div class="card">
        <div class="passage-wrap"><div id="passage" class="serif"></div></div>
        <textarea id="input" class="serif" rows="3" placeholder="এখানে টাইপ করা শুরু করুন…" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"></textarea>

        <table>
          <thead><tr><th>র‍্যাঙ্ক</th><th>নাম</th><th>সেরা WPM</th><th>নির্ভুলতা</th></tr></thead>
          <tbody id="leaderboardBody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <footer>Abdullah Online Zone and Training Center · Firebase দিয়ে চালিত</footer>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword,
  onAuthStateChanged, signOut
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {
  getFirestore, doc, setDoc, getDoc, addDoc, collection,
  query, orderBy, limit, onSnapshot
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDd0MRK3C4_1N8lrlyhNQsPKJAAPfoWR2Y",
  authDomain: "online-gon.firebaseapp.com",
  projectId: "online-gon",
  storageBucket: "online-gon.firebasestorage.app",
  messagingSenderId: "370055293396",
  appId: "1:370055293396:web:1cafecdc166bd7d0ff8e41"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let currentRole = "student";
let isRegisterMode = false;
let currentUser = null;
let currentUserData = null;

const roleToggle = document.getElementById('roleToggle');
const authTitle = document.getElementById('authTitle');
const authSubmit = document.getElementById('authSubmit');
const toggleMode = document.getElementById('toggleMode');
const nameField = document.getElementById('nameField');
const authMsg = document.getElementById('authMsg');

roleToggle.addEventListener('click', (e) => {
  if(e.target.tagName !== 'BUTTON') return;
  [...roleToggle.children].forEach(b => b.classList.remove('active'));
  e.target.classList.add('active');
  currentRole = e.target.dataset.role;
});

function showAuthMsg(text, type){
  authMsg.textContent = text;
  authMsg.className = 'authMsg show ' + type;
}

function setAuthMode(register){
  isRegisterMode = register;
  authTitle.textContent = register ? 'নতুন অ্যাকাউন্ট তৈরি করুন' : 'লগইন করুন';
  authSubmit.textContent = register ? 'অ্যাকাউন্ট তৈরি করুন' : 'লগইন করুন';
  toggleMode.textContent = register ? 'আগে থেকে অ্যাকাউন্ট আছে? লগইন করুন' : 'অ্যাকাউন্ট তৈরি করুন';
  nameField.style.display = register ? 'block' : 'none';
  authMsg.classList.remove('show');
}
setAuthMode(false);

toggleMode.addEventListener('click', () => setAuthMode(!isRegisterMode));

authSubmit.addEventListener('click', async () => {
  const email = document.getElementById('emailInput').value.trim();
  const pass = document.getElementById('passInput').value;
  const name = document.getElementById('nameInput').value.trim();

  if(!email || !pass){ showAuthMsg('ইমেইল ও পাসওয়ার্ড দিন', 'error'); return; }

  try{
    if(isRegisterMode){
      if(!name){ showAuthMsg('নাম দিন', 'error'); return; }
      const cred = await createUserWithEmailAndPassword(auth, email, pass);
      await setDoc(doc(db, 'users', cred.user.uid), {
        name, role: currentRole, email, bestWpm: 0, bestAcc: 100
      });
    } else {
      await signInWithEmailAndPassword(auth, email, pass);
    }
  } catch(err){
    showAuthMsg(err.message, 'error');
  }
});

document.getElementById('logoutBtn').addEventListener('click', () => signOut(auth));

onAuthStateChanged(auth, async (user) => {
  currentUser = user;
  if(user){
    const snap = await getDoc(doc(db, 'users', user.uid));
    currentUserData = snap.exists() ? snap.data() : { name: user.email, role: 'student', bestWpm:0, bestAcc:100 };
    document.getElementById('authScreen').classList.add('hidden');
    document.getElementById('appScreen').classList.remove('hidden');
    document.getElementById('whoBar').classList.remove('hidden');
    document.getElementById('whoLabel').textContent =
      currentUserData.name + ' (' + (currentUserData.role === 'teacher' ? 'প্রশিক্ষক' : 'শিক্ষার্থী') + ')';
    resetTest(true);
  } else {
    currentUserData = null;
    document.getElementById('authScreen').classList.remove('hidden');
    document.getElementById('appScreen').classList.add('hidden');
    document.getElementById('whoBar').classList.add('hidden');
  }
});

/* ---------- Tabs ---------- */
document.querySelectorAll('.tabs button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tabs button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const tab = btn.dataset.tab;
    document.getElementById('typingTab').classList.toggle('hidden', tab !== 'typing');
    document.getElementById('leaderboardTab').classList.toggle('hidden', tab !== 'leaderboard');
  });
});

/* ---------- Leaderboard (live) ---------- */
const lbQuery = query(collection(db, 'users'), orderBy('bestWpm', 'desc'), limit(20));
onSnapshot(lbQuery, (snap) => {
  const body = document.getElementById('leaderboardBody');
  body.innerHTML = '';
  let rank = 1;
  snap.forEach(docSnap => {
    const d = docSnap.data();
    const tr = document.createElement('tr');
    if(currentUser && docSnap.id === currentUser.uid) tr.className = 'me';
    tr.innerHTML = `<td>#${rank}</td><td>${d.name || ''}</td><td>${d.bestWpm || 0}</td><td>${d.bestAcc || 100}%</td>`;
    body.appendChild(tr);
    rank++;
  });
});

/* ---------- Typing test ---------- */
const TEXTS = [
  "গ্রামের পুকুরপাড়ে সন্ধ্যাবেলা বাতাসে হালকা কুয়াশা মিশে থাকত, আর দূরে কোথাও শোনা যেত রাখালের বাঁশির সুর।",
  "মায়ের হাতের রান্নার গন্ধ পেলেই মনে হয় সারাদিনের ক্লান্তি এক নিমেষে মিলিয়ে গেছে।",
  "নতুন বই খুললেই প্রথম পাতার গন্ধটা আমাকে সবসময় ছেলেবেলার কথা মনে করিয়ে দেয়।",
  "The quick brown fox jumps over the lazy dog. Practice daily to improve your typing speed.",
  "A good cup of tea, a comfortable chair, and an hour of silence can fix almost any bad morning."
];

let duration = 30, timeLeft = duration, timer = null, started = false, passageText = "";
const passageEl = document.getElementById('passage');
const inputEl = document.getElementById('input');
const statWpm = document.getElementById('statWpm');
const statAcc = document.getElementById('statAcc');
const statTime = document.getElementById('statTime');
const statErr = document.getElementById('statErr');
const resultBanner = document.getElementById('resultBanner');

function pickPassage(){ return TEXTS[Math.floor(Math.random()*TEXTS.length)]; }

function renderPassage(){
  passageEl.innerHTML = "";
  [...passageText].forEach((ch) => {
    const span = document.createElement('span');
    span.textContent = ch; span.className = 'char-pending';
    passageEl.appendChild(span);
  });
  if(passageEl.firstChild) passageEl.firstChild.classList.add('char-current');
}

function resetTest(newPassage=true){
  clearInterval(timer); started = false; timeLeft = duration;
  statWpm.textContent = "0"; statAcc.textContent = "100%";
  statTime.textContent = timeLeft; statErr.textContent = "0";
  resultBanner.classList.remove('show');
  inputEl.value = ""; inputEl.disabled = false;
  if(newPassage) passageText = pickPassage();
  renderPassage();
}

function startTimer(){
  started = true;
  timer = setInterval(() => {
    timeLeft--; statTime.textContent = timeLeft;
    if(timeLeft <= 0) finishTest();
  }, 1000);
}

async function finishTest(){
  clearInterval(timer);
  inputEl.disabled = true;
  const typed = inputEl.value;
  const words = typed.trim().length === 0 ? 0 : typed.trim().split(/\s+/).length;
  const wpm = Math.round(words / (duration/60));
  const correctChars = [...typed].filter((c,i) => c === passageText[i]).length;
  const acc = typed.length === 0 ? 100 : Math.round((correctChars/typed.length)*100);
  statWpm.textContent = wpm; statAcc.textContent = acc + "%";
  resultBanner.textContent = `ফলাফল: প্রতি মিনিটে ${wpm} শব্দ, নির্ভুলতা ${acc}%।`;
  resultBanner.classList.add('show');

  if(currentUser){
    await addDoc(collection(db,'results'), {
      uid: currentUser.uid, name: currentUserData.name, wpm, acc, at: Date.now()
    });
    if(!currentUserData.bestWpm || wpm > currentUserData.bestWpm){
      currentUserData.bestWpm = wpm;
      currentUserData.bestAcc = acc;
      await setDoc(doc(db,'users',currentUser.uid), currentUserData, { merge:true });
    }
  }
}

inputEl.addEventListener('input', () => {
  if(!started && inputEl.value.length > 0) startTimer();
  const typed = inputEl.value;
  let errs = 0;
  const spans = passageEl.children;
  for(let i=0;i<spans.length;i++){
    const span = spans[i]; span.classList.remove('char-current');
    if(i < typed.length){
      if(typed[i] === passageText[i]) span.className = 'char-correct';
      else { span.className = 'char-wrong'; errs++; }
    } else span.className = 'char-pending';
  }
  if(typed.length < spans.length) spans[typed.length].classList.add('char-current');
  statErr.textContent = errs;
  const correctChars = [...typed].filter((c,i) => c === passageText[i]).length;
  const acc = typed.length === 0 ? 100 : Math.round((correctChars/typed.length)*100);
  statAcc.textContent = acc + "%";
  if(typed.length >= passageText.length) finishTest();
});

document.getElementById('restart').addEventListener('click', () => resetTest(true));
</script>
